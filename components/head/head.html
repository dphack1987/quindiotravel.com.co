                "name": "¿Cómo llegar al Quindío desde Bogotá?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Para llegar al Quindío desde Bogotá puede tomar un vuelo de 45 minutos al Aeropuerto El Edén en Armenia, o viajar por carretera en aproximadamente 4-5 horas por la ruta norte. También hay servicios de bus intermunicipales desde el Terminal de Transporte de Bogotá."
                }
            },
            {
                "@type": "Question",
                "name": "¿Cuál es la mejor época para visitar el Eje Cafetero?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "La mejor época para visitar el Eje Cafetero es durante todo el año, pero especialmente de enero a marzo (temporada seca) y de julio a agosto. Estos meses ofrecen clima ideal para visitar el Valle de Cocora, Salento y disfrutar de las actividades al aire libre."
                }
            },
            {
                "@type": "Question",
                "name": "¿Qué servicios turísticos ofrece Quindío Travel?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Quindío Travel ofrece servicios completos de turismo: planes paquetes, transporte terrestre y aéreo, alojamiento en fincas hoteles y cabañas, entradas a parques temáticos, asistencia médica, planes empresariales y experiencias personalizadas de turismo en el Quindío."
                }
            },
            {
                "@type": "Question",
                "name": "¿Cuánto cuesta un plan de turismo al Eje Cafetero?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Los planes de turismo al Eje Cafetero varían según la duración, temporada, tipo de transporte y alojamiento. Quindío Travel ofrece planes desde $425.000 COP por persona (economía, temporada baja, sin transporte) hasta $4.490.000 COP (VIP, temporada alta, con transporte). Todos incluyen alojamiento, alimentación (desayuno y cena) y asistencia médica."
                }
            },
            {
                "@type": "Question",
                "name": "¿Dónde están los mejores termales del Eje Cafetero?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Los mejores termales del Eje Cafetero se encuentran en Santa Rosa de Cabal, Risaralda, a 30 minutos de Armenia. Los Termales Santa Rosa son los más populares, ofreciendo aguas termales volcánicas con propiedades terapéuticas, piscinas termales, masajes y servicios de wellness completos."
                }
            },
            {
                "@type": "Question",
                "name": "¿Qué actividades turísticas se pueden hacer en Salento?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "En Salento puede visitar el Valle de Cocora con sus palmas de cera, recorrer la Calle del Tiempo Detenida, visitar el mirador Alto de la Cruz, disfrutar de gastronomía típica, comprar artesanías en guadua, y visitar cafeterías tradicionales. Es uno de los pueblos más hermosos del Eje Cafetero."
                }
            },
            {
                "@type": "Question",
                "name": "¿Qué include un plan de turismo completo en el Quindío?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Un plan de turismo completo en el Quindío incluye: transporte desde el aeropuerto o terminal terrestre en Armenia, alojamiento en fincas hoteles o cabañas, alimentación (desayunos y cenas), entradas a parques temáticos, asistencia médica durante el viaje, y coordinación completa de todas las actividades turísticas."
